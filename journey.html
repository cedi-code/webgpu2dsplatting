<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webgpu-2dsplatting journey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css" />
    <style>
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 900px;
        margin: 0 auto;
        padding: 32px;
      }

      .markdown-body .shiki {
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        margin-bottom: 16px;
      }
      .markdown-body .shiki .line {
        display: inline-block;
        width: 100%;
      }

      /* Diff Add Style */
      .markdown-body .shiki .diff.add {
        background-color: rgba(46, 160, 67, 0.2);
      }
      .markdown-body .shiki .diff.add::before {
        content: '+';
        color: #3fb950;
        position: absolute;
        left: 8px;
      }

      /* Diff Remove Style */
      .markdown-body .shiki .diff.remove {
        background-color: rgba(248, 81, 73, 0.2);
        opacity: 0.8;
      }
      .markdown-body .shiki .diff.remove::before {
        content: '-';
        color: #f85149;
        position: absolute;
        left: 8px;
      }

      .markdown-body .katex-display {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 8px 0;
      }
      .sliders-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 0 auto;
      }

      .sliders-row .slider {
        min-width: 100px;
        max-width: 280px;
      }
      canvas {
        display: block;
        width: 400px;
        height: 300px;
        margin: 0 auto;
        padding: 10px;
      }
      body {
        background-color: rgb(190, 200, 255);
        color: black;
      }
    </style>
  </head>
  <body>
    <h1>My little journey</h1>
    <div class="markdown-body markdown-dark" id="markdown-intro"></div>
    <h1>Render a 2d gaussian</h1>
    <div class="markdown-body markdown-dark" id="markdown-setup"></div>
    <canvas class="markdown-body" id="setup"></canvas>

    <div class="markdown-body markdown-dark" id="markdown-drawgauss"></div>

    <div class="markdown-body">
      <div class="sliders-row">
        <div>
          <div class="slider" id="variance-slider"></div>
          <div class="slider" id="pos-slider"></div>
          Input Powered by <a href="https://tweakpane.github.io/docs/" target="_blank">Tweakpane</a>
        </div>
        <canvas id="draw-elipse"></canvas>
      </div>
    </div>

    <div class="markdown-body markdown-dark" id="markdown-elipsoid"></div>
    <canvas class="markdown-body" id="rotate-scale-elipse"></canvas>




    <script type="module" src="src/journey/mainJourney.ts"></script>
    <script type="module" src="src/journey/scripts/setup/mainSetup.ts"></script>
    <script type="module" src="src/journey/scripts/draw/mainElipse.ts"></script>

    
  </body>
</html>
